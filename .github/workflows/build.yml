name: Build DFU bootloader & blink example

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Arm GNU Toolchain (pinned, same as the Windows job)
      uses: carlosperate/arm-none-eabi-gcc-action@v1
      with:
        release: '13.2.Rel1'

    - name: Install CMake
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential

    - name: Build Bootloader
      run: |
        chmod +x ./build_and_flash.sh
        ./build_and_flash.sh --clean

    - name: Build Blink Example
      run: |
        chmod +x ./example_blink/build_and_flash.sh
        ./example_blink/build_and_flash.sh --clean

    - name: Test Make build (Bootloader, Updater & Blink)
      run: |
        make clean-all
        make
        make blink

    - name: Check bootloader size (must fit one 4 KB page)
      run: |
        arm-none-eabi-size build/milandr_dfu_bootloader.elf || true
        size=$(wc -c < build/milandr_dfu_bootloader.bin)
        echo "bootloader.bin = $size bytes (limit 4096)"
        test "$size" -le 4096

    - name: Upload Bootloader Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bootloader
        path: |
          build/milandr_dfu_bootloader.bin
          build/milandr_dfu_bootloader.hex
          build/milandr_dfu_bootloader
        retention-days: 3

    - name: Upload Bootloader Updater Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bootloader-updater
        path: |
          updater/build/dfu_bootloader_updater.bin
          updater/build/dfu_bootloader_updater.hex
          updater/build/dfu_bootloader_updater.elf
        retention-days: 3

    - name: Upload Blink Example Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: blink-example
        path: |
          example_blink/build/blink.bin
          example_blink/build/blink.hex
          example_blink/build/blink
        retention-days: 3

